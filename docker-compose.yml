# One command brings up SQL Server 2025 and the app in demo mode (no AI keys needed):
#   docker compose up --build
# Optional overrides live in a git-ignored .env (copy .env.example): AI providers and keys, ports, SA password.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      # Demo-only default so the stack starts with no configuration. Override MSSQL_SA_PASSWORD in .env for anything else.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-FaultDesk_Dev_Passw0rd!}"
      MSSQL_PID: Developer
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # tools18 enforces TLS; -C trusts the container's self-signed certificate, -b makes failures non-zero.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__FaultDesk: "Server=sqlserver,1433;Database=FaultDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-FaultDesk_Dev_Passw0rd!};Encrypt=True;TrustServerCertificate=True"
      # Mock by default so the stack runs with no API keys. Set the providers and keys in .env for the real thing.
      Ai__ChatProvider: "${AI_CHAT_PROVIDER:-Mock}"
      Ai__EmbeddingProvider: "${AI_EMBEDDING_PROVIDER:-Mock}"
      Ai__Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
      Ai__OpenAI__ApiKey: "${OPENAI_API_KEY:-}"

volumes:
  mssql-data:
